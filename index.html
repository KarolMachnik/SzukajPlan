<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wspólne Zajęcia - Wyszukiwarka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prosty scrollbar dla estetyki */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; rounded-lg; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Nagłówek -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Znajdź wspólne zajęcia</h1>
            <p class="text-slate-600">Wyszukaj osobę, aby zobaczyć z kim dzieli grupy zajęciowe w semestrze 3.</p>
        </header>

        <!-- Wyszukiwarka z Autocomplete -->
        <div class="relative max-w-lg mx-auto mb-10" id="searchContainer">
            <div class="relative">
                <input type="text" id="searchInput" 
                    class="w-full p-4 pl-12 pr-4 rounded-xl border border-slate-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg"
                    placeholder="Wpisz imię lub nazwisko..." autocomplete="off">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="h-6 w-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
            
            <!-- Lista podpowiedzi -->
            <ul id="suggestionsList" class="absolute z-10 w-full bg-white border border-slate-200 rounded-xl mt-2 shadow-xl hidden max-h-72 overflow-y-auto divide-y divide-slate-100">
                <!-- Elementy listy dodawane przez JS -->
            </ul>
        </div>

        <!-- Kontener na wyniki -->
        <div id="resultsContainer" class="hidden animate-fade-in-up">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-blue-600 text-white p-6">
                    <h2 class="text-2xl font-semibold" id="selectedStudentName">Wybrana osoba</h2>
                    <p class="text-blue-100 mt-1">Lista osób, z którymi dzielisz najwięcej zajęć.</p>
                </div>
                
                <div class="p-0">
                    <ul id="sharedClassesList" class="divide-y divide-slate-200">
                        <!-- Wyniki generowane przez JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            suggestionsList.innerHTML = '';
            
            if (query.length === 0) {
                suggestionsList.classList.add('hidden');
                return;
            }

            const matches = studentsData.filter(student => 
                student.name.toLowerCase().includes(query)
            );

            if (matches.length > 0) {
                suggestionsList.classList.remove('hidden');
                matches.forEach(student => {
                    const li = document.createElement('li');
                    li.className = 'px-4 py-3 hover:bg-blue-50 cursor-pointer text-slate-700 transition-colors duration-150';
                    li.textContent = student.name;
                    
                    li.addEventListener('click', () => {
                        searchInput.value = student.name;
                        suggestionsList.classList.add('hidden');
                        showSharedClasses(student);
                    });
                    
                    suggestionsList.appendChild(li);
                });
            } else {
                suggestionsList.classList.add('hidden');
            }
        });

        // Ukryj podpowiedzi po kliknięciu poza wyszukiwarką
        document.addEventListener('click', function(e) {
            if (!document.getElementById('searchContainer').contains(e.target)) {
                suggestionsList.classList.add('hidden');
            }
        });

        // Funkcja obliczająca i wyświetlająca wspólne zajęcia
        function showSharedClasses(selectedStudent) {
            let sharedData = [];

            studentsData.forEach(otherStudent => {
                if (otherStudent.id === selectedStudent.id) return;

                let sharedSubjects = [];
                for (const [subject, group] of Object.entries(selectedStudent.groups)) {
                    if (otherStudent.groups[subject] && otherStudent.groups[subject] === group) {
                        sharedSubjects.push(`${subject} (Gr. ${group})`);
                    }
                }

                if (sharedSubjects.length > 0) {
                    sharedData.push({
                        name: otherStudent.name,
                        count: sharedSubjects.length,
                        subjects: sharedSubjects
                    });
                }
            });

            // Sortowanie malejąco po ilości wspólnych zajęć
            sharedData.sort((a, b) => b.count - a.count);

            // Aktualizacja interfejsu
            selectedStudentName.textContent = selectedStudent.name;
            sharedClassesList.innerHTML = '';

            if (sharedData.length === 0) {
                sharedClassesList.innerHTML = `<li class="p-6 text-center text-slate-500">Brak osób o wspólnych grupach zajęciowych.</li>`;
            } else {
                sharedData.forEach(match => {
                    const li = document.createElement('li');
                    li.className = 'p-6 flex flex-col md:flex-row md:items-start justify-between gap-4 hover:bg-slate-50 transition-colors';
                    
                    const nameContainer = document.createElement('div');
                    nameContainer.className = 'flex items-center gap-3';
                    nameContainer.innerHTML = `
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg shrink-0">
                            ${match.count}
                        </div>
                        <div>
                            <h3 class="font-semibold text-lg text-slate-800">${match.name}</h3>
                            <p class="text-sm text-slate-500">Ilość wspólnych przedmiotów: <span class="font-medium text-slate-700">${match.count}</span></p>
                        </div>
                    `;

                    const subjectsContainer = document.createElement('div');
                    subjectsContainer.className = 'flex flex-wrap gap-2 md:max-w-md md:justify-end';
                    
                    match.subjects.forEach(subj => {
                        const badge = document.createElement('span');
                        badge.className = 'px-2.5 py-1 bg-slate-100 text-slate-600 rounded-md text-xs font-medium border border-slate-200';
                        badge.textContent = subj;
                        subjectsContainer.appendChild(badge);
                    });

                    li.appendChild(nameContainer);
                    li.appendChild(subjectsContainer);
                    sharedClassesList.appendChild(li);
                });
            }

            resultsContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
